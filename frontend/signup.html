<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - RideNow</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h2>Create Account</h2>

            <p class="subtitle">
                Join RideNow and book your ride
            </p>

            <!-- Full Name -->
            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required
            >

            <!-- Email -->
            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <!-- Phone -->
            <input
                type="tel"
                id="phone"
                placeholder="Phone Number"
                required
            >

            <!-- Password -->
            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <!-- Signup Button -->
            <button
                type="button"
                onclick="signupUser()">
                Sign Up
            </button>

            <div class="extra-links">

                <p>
                    Already have an account?
                    <a href="login.html">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </div>

    <!-- Signup JavaScript -->
    <script src="signup.js"></script>

</body>

</html>
